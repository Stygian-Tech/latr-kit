name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Swift tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap
        run: bash scripts/bootstrap.sh

      - name: Check
        run: bash scripts/check.sh
